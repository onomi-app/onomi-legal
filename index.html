<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onomi &mdash; Legal</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FFFDF6;
    --text: #2B2620;
    --muted: #6b6255;
    --accent: #C9722B;
    --rule: #E7DFCF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1812;
      --text: #F1ECE1;
      --muted: #B9AF9C;
      --accent: #E8A05C;
      --rule: #3A342A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 480px; padding: 40px 24px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p.sub { color: var(--muted); margin: 0 0 32px; }
  a.card {
    display: block;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  a.card span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 4px; }
  a.card:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Onomi</h1>
    <p class="sub">Legal documents</p>
    <a class="card" href="./privacy/">Privacy Policy<span>Effective September 1, 2026</span></a>
  </div>
</body>
</html>
